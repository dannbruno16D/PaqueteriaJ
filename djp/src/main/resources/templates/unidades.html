<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paquetería DJP · Unidades y Personal</title>
    <link rel="stylesheet" th:href="@{/djp.css}">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <div class="brand-badge">DJP</div>
        <div>
            <h1>Paquetería <span>DJP</span></h1>
            <p class="subtitle">Flota, transportistas y administración</p>
        </div>
    </div>
    <nav class="nav-links">
        <a th:href="@{/}" class="nav-link">Inicio / Rastreo</a>
        <a th:href="@{/paquetes}" class="nav-link">Paquetes</a>
        <a th:href="@{/unidades}" class="nav-link active">Unidades y Personal</a>
    </nav>
</header>

<main class="container">
    <section class="grid-2">
        <div class="card">
            <h2>Registrar Unidad de Reparto</h2>
            <form th:action="@{/unidades/registrar}" method="post" class="form-grid">
                <div class="form-group">
                    <label for="numeroEconomico">Número económico</label>
                    <input id="numeroEconomico" type="text" name="numeroEconomico" placeholder="Ej. DJP-03" required>
                </div>
                <div class="form-group">
                    <label for="tipoUnidad">Tipo de unidad</label>
                    <input id="tipoUnidad" type="text" name="tipoUnidad" placeholder="Ej. Camioneta" required>
                </div>
                <div class="form-group">
                    <label for="capacidadKg">Capacidad (kg)</label>
                    <input id="capacidadKg" type="number" step="1" min="1" name="capacidadKg" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Agregar Unidad</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Registrar Transportista o Administrador</h2>
            <form th:action="@{/unidades/usuarios/registrar}" method="post" class="form-grid">
                <div class="form-group">
                    <label for="nombreCompleto">Nombre completo</label>
                    <input id="nombreCompleto" type="text" name="nombreCompleto" placeholder="Ej. Luis Hernández" required>
                </div>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input id="username" type="text" name="username" placeholder="Ej. lhernandez" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" name="password" placeholder="Ej. 1234" required>
                </div>
                <div class="form-group">
                    <label for="rol">Rol</label>
                    <select id="rol" name="rol" required>
                        <option value="TRANSPORTISTA">TRANSPORTISTA</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Registrar Personal</button>
                </div>
            </form>
        </div>
    </section>

    <section class="grid-2">
        <div class="card">
            <h2>Unidades Registradas</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Económico</th>
                        <th>Tipo</th>
                        <th>Capacidad</th>
                        <th>Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${unidades}">
                        <td><strong class="codigo-highlight" th:text="${u.numeroEconomico}"></strong></td>
                        <td th:text="${u.tipoUnidad}"></td>
                        <td th:text="${u.capacidadKg + ' kg'}"></td>
                        <td>
                            <form th:action="@{/unidades/{id}/eliminar(id=${u.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>Personal Registrado (Transportistas y Admin)</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Registro</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usr : ${usuarios}">
                        <td th:text="${usr}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
</body>
</html>
