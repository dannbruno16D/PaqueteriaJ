<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Paquetería DJP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0d12;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #121620;
            padding: 14px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2533;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .brand-badge {
            background-color: #f59e0b;
            color: #111827;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .brand-title {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
        }
        .brand-subtitle {
            color: #9ca3af;
            font-size: 0.8rem;
        }
        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        nav a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 0.92rem;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #f59e0b;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
        }
        .login-card {
            background-color: #1a1f2c;
            border-left: 3px solid #f59e0b;
            border-radius: 10px;
            padding: 36px 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        }
        .login-card h1 {
            color: #fbbf24;
            text-align: center;
            font-size: 1.7rem;
            margin-bottom: 24px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-control {
            width: 100%;
            background-color: #252b3b;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 13px 14px;
            color: #f9fafb;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control::placeholder {
            color: #9ca3af;
        }
        .form-control:focus {
            border-color: #f59e0b;
        }
        .btn-submit {
            width: 100%;
            background-color: #f59e0b;
            color: #111827;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            padding: 13px;
            margin-top: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #d97706;
        }
        .error-msg {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            margin-bottom: 14px;
            text-align: center;
        }
        .card-footer-links {
            margin-top: 18px;
            text-align: center;
            font-size: 0.85rem;
            color: #9ca3af;
        }
        .card-footer-links a {
            color: #9ca3af;
            text-decoration: none;
        }
        .card-footer-links a.register-link {
            color: #fbbf24;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <a th:href="@{/}" class="brand">
            <span class="brand-badge">DJP</span>
            <div>
                <div class="brand-title">Paquetería DJP</div>
                <div class="brand-subtitle">Control logístico y rastreo en tiempo real</div>
            </div>
        </a>
        <nav>
            <a th:href="@{/}">Inicio / Rastreo</a>
            <a th:href="@{/paquetes}">Paquetes</a>
            <a th:href="@{/unidades}">Unidades y Personal</a>
            <a th:if="${session.usuarioLogueado == null}" th:href="@{/login}">Iniciar sesión</a>
            <a th:if="${session.usuarioLogueado != null}" th:href="@{/logout}" th:text="'Cerrar sesión (' + ${session.usuarioLogueado} + ')'">Cerrar sesión</a>
        </nav>
    </header>

    <main>
        <div class="login-card">
            <h1>Iniciar sesión</h1>

            <div th:if="${error}" class="error-msg" th:text="${error}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <input type="text"
                           name="usuario"
                           class="form-control"
                           placeholder="Usuario o correo electrónico"
                           required>
                </div>
                <div class="form-group">
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Contraseña"
                           required>
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>

            <div class="card-footer-links">
                <a th:href="@{/login}">¿Olvidaste tu contraseña?</a>
                <a th:href="@{/login}" class="register-link">Registrarse</a>
            </div>
        </div>
    </main>
</body>
</html>
